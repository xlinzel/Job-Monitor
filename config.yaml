# =============================================================================
# Global keyword filters
# =============================================================================
filters:
  include_keywords:
    # - "software engineer"
    # - "backend"
    # - "senior engineer"
  exclude_keywords:
    # - "intern"
    # - "director"

# =============================================================================
# Reminder sections included with new-job alerts
# =============================================================================
reminders:
  internship_keywords:
    - intern
    - internship
    - co-op
    - co op
    - coop
    - co-operative
    - cooperative
    - trainee
    - traineeship
    - student
    - university
    - apprentice
    - apprenticeship

# =============================================================================
# Notifications - set via GitHub Actions secrets
# =============================================================================
notifications:
  webhook_url: ""
  telegram_bot_token: ""
  telegram_chat_id: ""
