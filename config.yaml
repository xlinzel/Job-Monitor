# =============================================================================
# Job Monitor Configuration
# =============================================================================
# Supported ATS types:
#   greenhouse, lever, ashby, workday, smartrecruiters, jazzhr, bamboohr,
#   jibe, eightfold, oracle_hcm, successfactors, radancy, asml_sitemap,
#   samsungsemi, html
#
# To find a company's ATS, check their careers page URL:
#   - Greenhouse: boards.greenhouse.io/SLUG
#   - Lever: jobs.lever.co/SLUG
#   - Ashby: jobs.ashbyhq.com/SLUG
#   - Workday: TENANT.wd1.myworkdayjobs.com (slug = "tenant/site")
#   - SmartRecruiters: careers.smartrecruiters.com/SLUG
#   - Otherwise: use html with the full careers page URL, or add a custom fetcher
# =============================================================================

