name: Job Monitor

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a Discord/Telegram test alert instead of checking jobs"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ github.event.inputs.test_alert || 'false' }}
        run: python monitor.py

      - name: Commit updated state
        if: ${{ github.event.inputs.test_alert != 'true' }}
        run: |
          git config user.name "job-monitor[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && echo "No state changes" || git commit -m "chore: update job monitor state [skip ci]"
          git push
